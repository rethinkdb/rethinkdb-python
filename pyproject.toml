[tool.poetry]
name = "rethinkdb"
version = "2.5.0"
license = "Apache-2.0"
description = "Python client for RethinkDB."
documentation = "https://rethinkdb.com/api/python/"
repository = "https://github.com/rethinkdb/rethinkdb-python/"
readme = "README.rst"
keywords = ["database", "rethinkdb", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",

]
authors = ["RethinkDB <bugs@rethinkdb.com>"]
maintainers = ["RethinkDB <bugs@rethinkdb.com>"]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/rethinkdb/rethinkdb-python/issues/"

# RethinkDB is aliasing the commands to `rethinkdb <command>`, therefore it
# can be executed as `rethinkdb dump` or `rethinkdb-dump`.
[tool.poetry.scripts]
rethinkdb-dump = "rethinkdb.cli._dump:cmd_dump"
rethinkdb-export = "rethinkdb.cli._export:cmd_export"
rethinkdb-import = "rethinkdb.cli._import:cmd_import"
rethinkdb-index-rebuild = "rethinkdb.cli._index_rebuild:cmd_index_rebuild"
rethinkdb-repl = "rethinkdb.cli._repl:cmd_repl"
rethinkdb-restore = "rethinkdb.cli._restore:cmd_restore"

[tool.poetry.dependencies]
pydantic = "^2.11"
python = "^3.12"
ujson = "^5.10.0"
click = "^8.2.1"
pyyaml = "^6.0.2"

twisted = { version = "^25.5", optional = true }
tornado = { version = "^6.5", optional = true }
gevent = { version = "^25.5", optional = true }
trio = { version = "^0.30", optional = true }

[tool.poetry.group.dev.dependencies]
black = "^25.1"
coverage = "^7.9"
flake8 = "^7.3"
hypothesis = "^6.135"
mypy = "^1.16"
pylint = "^3.3"
pytest = "^8.1.1"
sphinx-rtd-theme = "^3.0"
pytest-twisted = "^1.14.0"
pytest-asyncio = "^0.23.6"
pytest-trio = "^0.8.0"
ruff = "^0.3.4"

[tool.poetry.extras]
all = ["twisted", "tornado", "gevent", "trio"]
twisted = ["twisted"]
tornado = ["tornado"]
gevent = ["gevent"]
trio = ["trio"]

[tool.black]
target-version = ['py312']
exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | rethinkdb/ql2_pb2\.py
)/
'''

[tool.isort]
atomic = true
case_sensitive = true
combine_star = true
force_sort_within_sections = true
include_trailing_comma = true
order_by_type = true
line_length = 88                  # Same as Black's line length
multi_line_output = 3

[build-system]
requires = ["poetry>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
